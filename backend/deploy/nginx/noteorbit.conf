upstream auth_api { server auth-api:8000; }
upstream admin_api { server admin-api:8000; }
upstream academics_api { server academics-api:8000; }
upstream campus_api { server campus-api:8000; }
upstream attendance_api { server attendance-api:8000; }
upstream comms_api { server comms-api:8000; }
upstream ai_api { server ai-api:8000; }
upstream storage_api { server storage-api:8000; }

server {
    listen 80;
    client_max_body_size 50M;

    location /health { return 200 'ok'; add_header Content-Type text/plain; }

    location /auth/ { proxy_pass http://auth_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location = /register { proxy_pass http://auth_api; proxy_set_header Host $host; }
    location = /login { proxy_pass http://auth_api; proxy_set_header Host $host; }
    location = /me { proxy_pass http://auth_api; proxy_set_header Host $host; }

    # campus-api owns /admin/hostel/* and /admin/fees/* (must be before /admin/)
    location /admin/hostel/ { proxy_pass http://campus_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /admin/fees/ { proxy_pass http://campus_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    location /admin/ { proxy_pass http://admin_api; proxy_set_header Host $host; }

    location /upload-note { proxy_pass http://academics_api; proxy_set_header Host $host; }
    location /notes { proxy_pass http://academics_api; proxy_set_header Host $host; }
    location /create-notice { proxy_pass http://academics_api; proxy_set_header Host $host; }
    location /notices { proxy_pass http://academics_api; proxy_set_header Host $host; }
    # comms-api owns faculty parent messaging (must be before /faculty/)
    location = /faculty/conversations { proxy_pass http://comms_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /faculty/messages/ { proxy_pass http://comms_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    location /faculty/ { proxy_pass http://academics_api; proxy_set_header Host $host; }
    location /student/marks { proxy_pass http://academics_api; proxy_set_header Host $host; }
    location /student/feedback { proxy_pass http://academics_api; proxy_set_header Host $host; }
    location /student/attendance { proxy_pass http://academics_api; proxy_set_header Host $host; }

    # ai-api owns academic insights (must be before /api/)
    location = /api/academic-insights { proxy_pass http://ai_api; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    location /api/ { proxy_pass http://academics_api; proxy_set_header Host $host; }

    location /hostel/ { proxy_pass http://campus_api; proxy_set_header Host $host; }
    location /student/hostel/ { proxy_pass http://campus_api; proxy_set_header Host $host; }
    location /fees/ { proxy_pass http://campus_api; proxy_set_header Host $host; }
    location /demo/ { proxy_pass http://campus_api; proxy_set_header Host $host; }

    location /attendance/ { proxy_pass http://attendance_api; proxy_set_header Host $host; }

    location /parent/ { proxy_pass http://comms_api; proxy_set_header Host $host; }

    location /chat { proxy_pass http://ai_api; proxy_set_header Host $host; }
    location /ai/ { proxy_pass http://ai_api; proxy_set_header Host $host; }

    location /objects/ { proxy_pass http://storage_api; proxy_set_header Host $host; }

    location / { proxy_pass http://auth_api; proxy_set_header Host $host; }
}
